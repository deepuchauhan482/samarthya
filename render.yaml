services:
  - type: web
    name: samarthya
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: samarthya-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: samarthya-db
    plan: free
    region: singapore
    databaseName: samarthya
    user: samarthya
